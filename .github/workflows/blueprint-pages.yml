name: Blueprint Pages Reusable

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-blueprint-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Blueprint Site
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Share pinned dependencies with Blueprint
        run: |
          cmp lean-toolchain blueprint/lean-toolchain
          jq -e -s '
            (.[0].packages | map({key: .name, value: .}) | from_entries) as $root |
            all(.[1].packages[]; . as $pkg |
              if $root | has($pkg.name) then
                [$pkg.type, $pkg.url, $pkg.rev, $pkg.subDir] ==
                [$root[$pkg.name].type, $root[$pkg.name].url,
                 $root[$pkg.name].rev, $root[$pkg.name].subDir]
              else true end)
          ' lake-manifest.json blueprint/lake-manifest.json
          mkdir -p blueprint/.lake .lake/packages
          ln -s ../../.lake/packages blueprint/.lake/packages
      - name: Restore incremental Lean build cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages
            blueprint/.lake/build
            vendor/VanKampen/.lake/build
          key: lean-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'blueprint/lean-toolchain', 'blueprint/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-shared-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'blueprint/lean-toolchain', 'blueprint/lake-manifest.json') }}-
      - name: Prepare compatible Lean dependency caches
        run: |
          bash scripts/get-mathlib-cache.sh
          (cd blueprint && bash ../scripts/get-mathlib-cache.sh)
      - name: Build formalization
        run: lake build
      - name: Check import coverage
        run: ./scripts/check-imports.py
      - name: Check for stray proof placeholders
        run: ./scripts/check-sorries.py
      - name: Check the axiom trust boundary
        run: CHECK_AXIOMS_SKIP_BUILD=1 ./scripts/check-axioms.sh
      - name: Build Blueprint site
        working-directory: blueprint
        env:
          BLUEPRINT_SKIP_CACHE_GET: "1"
        run: ./scripts/ci-pages.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: blueprint/_out/site/html-multi

  deploy:
    name: Deploy Blueprint Site
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
