name: Blueprint Pages Reusable

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-blueprint-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Blueprint Site
    runs-on: ubuntu-22.04
    env:
      LEAN_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-mathlib-cache: false
      - name: Share pinned dependencies with Blueprint
        run: |
          cmp lean-toolchain blueprint/lean-toolchain
          jq -e -s '
            (.[0].packages | map({key: .name, value: .}) | from_entries) as $root |
            all(.[1].packages[]; . as $pkg |
              if $root | has($pkg.name) then
                [$pkg.type, $pkg.url, $pkg.rev, $pkg.subDir] ==
                [$root[$pkg.name].type, $root[$pkg.name].url,
                 $root[$pkg.name].rev, $root[$pkg.name].subDir]
              else true end)
          ' lake-manifest.json blueprint/lake-manifest.json
          mkdir -p blueprint/.lake .lake/packages
          ln -s ../../.lake/packages blueprint/.lake/packages
      - name: Cache Blueprint artifacts
        uses: actions/cache@v4
        with:
          path: blueprint/.lake/build
          key: blueprint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'blueprint/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            blueprint-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'blueprint/lake-manifest.json') }}-
      - name: Prepare Blueprint dependency cache
        working-directory: blueprint
        run: lake exe cache get
      - name: Build Blueprint site
        working-directory: blueprint
        env:
          BLUEPRINT_SKIP_CACHE_GET: "1"
        run: ./scripts/ci-pages.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: blueprint/_out/site/html-multi

  deploy:
    name: Deploy Blueprint Site
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
