name = "sphere-six-complex"
version = "0.1.0"
defaultTargets = ["SphereSixComplex", "Challenge", "Solution"]

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "6175f404ffd431300a382afacd94be0098a45e25"

[[require]]
name = "JordanCurveTheorem"
git = "https://github.com/Paul-Lez/jordan-curve-theorem.git"
rev = "61a188babe190258db2b6f0a69a9c26f243fe9bd"
subDir = "HOLLight-Lean"

[[require]]
name = "VanKampen"
path = "vendor/VanKampen"

[[require]]
name = "DifferentialGeometry"
git = "https://github.com/deancureton/differential-geometry.git"
rev = "67e3631e3b8f532a31ac2375b2d50a4369044eec"

# Keep Mathlib last so its transitive dependency pins take precedence.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "SphereSixComplex"

# The definitions the trusted statement mentions. Imported by both `Challenge` and the
# development, so Comparator sees one shared copy rather than two elaborations.
[[lean_lib]]
name = "ChallengeDefs"

[[lean_lib]]
name = "ChallengeAxioms"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
